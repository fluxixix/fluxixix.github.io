<svg xmlns="http://www.w3.org/2000/svg" width="267" height="63" viewBox="0 0 267 63" role="img" aria-label="fluxixix">
  <title>fluxixix</title>
  <style>
    /* Silkscreen 是纯大写像素字，没有小写字形——"fluxixix" 会渲染成 FLUXIXIX。
       字体以 base64 内嵌（取自 readme-typing-svg 自己内联的那份子集），
       SVG 自带字形，不依赖任何外部字体服务。img 引用时外部资源会被禁用，
       只有内联的能用——GitHub 就是这么加载的。 */
    @font-face {
      font-family: 'Silkscreen';
      font-weight: 700;
      src: url(data:font/truetype;base64,) format('truetype');
    }

    .mark {
      font-family: 'Silkscreen', monospace;
      font-weight: 700;
      font-size: 40px;
      fill: url(#flux);
    }

    /* 关掉动效时退回纯色。SMIL 本身感知不到 prefers-reduced-motion，
       但把 fill 从渐变换掉，动画就画不出来，效果上等于停住 */
    @media (prefers-reduced-motion: reduce) {
      .mark { fill: #bd34fe; }
    }
  </style>

  <defs>
    <!-- 流动的来源。渐变向量正好占一个 bbox，spreadMethod="repeat" 把它平铺出去，
         再把 gradientTransform 平移一个 bbox —— 一个周期后画面与起点完全相同，
         所以循环是无缝的。只动颜色、不动字形，像素网格始终压在整像素上。 -->
    <linearGradient id="flux" x1="-1" y1="0" x2="0" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#bd34fe"/>
      <stop offset="0.5" stop-color="#41d1ff"/>
      <stop offset="1" stop-color="#bd34fe"/>
      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        from="-1 0" to="0 0"
        dur="6s"
        repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <text class="mark" x="133.5" y="47" text-anchor="middle">fluxixix</text>
</svg>
