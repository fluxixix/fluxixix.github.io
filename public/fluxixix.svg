<svg xmlns="http://www.w3.org/2000/svg" width="267" height="63" viewBox="0 0 267 63" role="img" aria-label="fluxixix">
  <title>fluxixix</title>
  <style>
    /* Silkscreen 是纯大写像素字，没有小写字形——"fluxixix" 会渲染成 FLUXIXIX。
       字体以 base64 内嵌（取自 readme-typing-svg 自己内联的那份子集），
       SVG 自带字形，不依赖任何外部字体服务。img 引用时外部资源会被禁用，
       只有内联的能用——GitHub 就是这么加载的。 */
    @font-face {
      font-family: 'Silkscreen';
      font-weight: 700;
      src: url(data:font/truetype;base64,) format('truetype');
    }

    .mark {
      font-family: 'Silkscreen', monospace;
      font-weight: 700;
      font-size: 40px;
      text-anchor: middle;
    }

    /* 流动的做法：渐变本身是静止的，被放进 mask 里当"油墨"的是一块
       铺满渐变的矩形，动的是这块矩形的 transform。
       这么写是因为 Safari 不重绘被动画的渐变属性——直接动
       gradientTransform 在 Safari 里是静止的，实测过。
       只动矩形、不动字形，像素网格始终压在整像素上。 */
    .plain { display: none; }

    /* 关掉动效时退回纯色 */
    @media (prefers-reduced-motion: reduce) {
      .flow { display: none; }
      .plain { display: inline; }
    }
  </style>

  <defs>
    <!-- spreadMethod="repeat" 让渐变按 267 的周期平铺出去，
         矩形正好每周期平移 267，所以一个循环结束时画面与起点完全相同。 -->
    <linearGradient id="flux" gradientUnits="userSpaceOnUse"
                    x1="0" y1="0" x2="267" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#bd34fe"/>
      <stop offset="0.5" stop-color="#41d1ff"/>
      <stop offset="1" stop-color="#bd34fe"/>
    </linearGradient>

    <mask id="wordmark">
      <text class="mark" x="133.5" y="47" fill="#fff">fluxixix</text>
    </mask>
  </defs>

  <g class="flow" mask="url(#wordmark)">
    <rect x="-267" y="0" width="801" height="63" fill="url(#flux)">
      <animateTransform attributeName="transform" type="translate"
                        from="0 0" to="267 0" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text class="mark plain" x="133.5" y="47" fill="#bd34fe">fluxixix</text>
</svg>
